name: Lint & Test PR

on:
  pull_request:
    branches: ["dev", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Prettier
        run: npx prettier --check .

      - name: Run ESLint
        run: npx eslint .

      - name: Run Tests
        run: npm test

      - name: Coverage thresholds
        if: matrix.node-version == '24'
        run: npm run test:coverage

  engine-floor:
    name: Engine floor
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      # Build on 20.x because Vitest and ESLint require Node >=20.19, while the
      # compiled package must still run on the engines.node floor below.
      - name: Setup Node.js 20 for the build
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Must match engines.node in package.json.
      - name: Setup Node.js 20.15.0
        uses: actions/setup-node@v7
        with:
          node-version: "20.15.0"

      - name: Run engine floor smoke test
        run: |
          node --version
          npm run test:floor
